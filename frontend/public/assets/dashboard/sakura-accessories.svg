<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="accGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="20" fill="#241a22" />
  <circle cx="200" cy="150" r="105" fill="#ec4899" opacity="0.12" filter="url(#accGlow)" />
  <!-- Llavero / Colgante Sakura dorado y rosa -->
  <g transform="translate(150, 50)">
    <!-- Aro superior -->
    <circle cx="50" cy="20" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
    <!-- Cadena -->
    <rect x="47" y="38" width="6" height="16" rx="3" fill="url(#goldGrad)" />
    <rect x="47" y="52" width="6" height="16" rx="3" fill="url(#goldGrad)" />
    <!-- Dije Flor de Cerezo grande -->
    <g transform="translate(50, 110) scale(1.1)" filter="url(#accGlow)">
      <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" />
      <!-- Pétalos -->
      <path d="M0,0 C12,-36 36,-36 36,0 C36,36 12,36 0,0 Z" fill="url(#accGrad)" transform="rotate(0)" />
      <path d="M0,0 C12,-36 36,-36 36,0 C36,36 12,36 0,0 Z" fill="url(#accGrad)" transform="rotate(72)" />
      <path d="M0,0 C12,-36 36,-36 36,0 C36,36 12,36 0,0 Z" fill="url(#accGrad)" transform="rotate(144)" />
      <path d="M0,0 C12,-36 36,-36 36,0 C36,36 12,36 0,0 Z" fill="url(#accGrad)" transform="rotate(216)" />
      <path d="M0,0 C12,-36 36,-36 36,0 C36,36 12,36 0,0 Z" fill="url(#accGrad)" transform="rotate(288)" />
      <!-- Centro brillante -->
      <circle cx="0" cy="0" r="9" fill="#ffffff" />
      <circle cx="0" cy="0" r="5" fill="url(#goldGrad)" />
    </g>
    <!-- Borla / Tassel colgante -->
    <path d="M44,155 L56,155 L60,200 L40,200 Z" fill="#ff758c" />
    <circle cx="50" cy="155" r="7" fill="url(#goldGrad)" />
  </g>
  <!-- Destellos mágicos -->
  <g transform="translate(280, 70) scale(0.6)" fill="#fde047">
    <polygon points="20,0 24,14 38,14 26,22 30,36 20,28 10,36 14,22 2,14 16,14" />
  </g>
  <g transform="translate(90, 160) scale(0.4)" fill="#fde047">
    <polygon points="20,0 24,14 38,14 26,22 30,36 20,28 10,36 14,22 2,14 16,14" />
  </g>
</svg>

