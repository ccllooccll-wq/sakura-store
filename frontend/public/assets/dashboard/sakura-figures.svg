<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="figGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sakuraGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="20" fill="#1e1a2e" />
  <circle cx="200" cy="150" r="110" fill="#818cf8" opacity="0.15" filter="url(#glow2)" />
  <!-- Pedestal / Base de exhibición acrílica -->
  <ellipse cx="200" cy="225" rx="85" ry="24" fill="#312b4f" stroke="#818cf8" stroke-width="2" />
  <ellipse cx="200" cy="220" rx="75" ry="18" fill="url(#figGrad)" opacity="0.4" />
  <!-- Silueta de figura coleccionable estilizada -->
  <g transform="translate(160, 60)">
    <!-- Aura brillante -->
    <circle cx="40" cy="50" r="50" fill="#ff7eb3" opacity="0.2" filter="url(#glow2)" />
    <!-- Cabeza y cabello anime estilizado -->
    <path d="M15,40 C10,20 25,5 40,5 C55,5 70,20 65,40 C65,55 55,65 40,65 C25,65 15,55 15,40 Z" fill="#ffb7c5" />
    <path d="M10,35 C0,45 5,75 18,70 C22,65 25,50 25,45 Z" fill="#ff758c" />
    <path d="M70,35 C80,45 75,75 62,70 C58,65 55,50 55,45 Z" fill="#ff758c" />
    <circle cx="32" cy="42" r="3.5" fill="#1e1a2e" />
    <circle cx="48" cy="42" r="3.5" fill="#1e1a2e" />
    <ellipse cx="26" cy="48" rx="4" ry="2" fill="#ff758c" opacity="0.7" />
    <ellipse cx="54" cy="48" rx="4" ry="2" fill="#ff758c" opacity="0.7" />
    <!-- Cuerpo / Vestido Sakura -->
    <path d="M30,68 L50,68 L60,120 L20,120 Z" fill="url(#sakuraGrad2)" />
    <path d="M25,72 L10,100 L16,104 L30,80 Z" fill="#ffffff" />
    <path d="M55,72 L70,100 L64,104 L50,80 Z" fill="#ffffff" />
    <!-- Piernas -->
    <rect x="30" y="120" width="8" height="35" rx="4" fill="#ffb7c5" />
    <rect x="42" y="120" width="8" height="35" rx="4" fill="#ffb7c5" />
  </g>
  <!-- Estrellas y destellos coleccionables -->
  <g transform="translate(90, 80) scale(0.7)" fill="#38bdf8">
    <polygon points="20,0 24,14 38,14 26,22 30,36 20,28 10,36 14,22 2,14 16,14" />
  </g>
  <g transform="translate(290, 95) scale(0.5)" fill="#ffd166">
    <polygon points="20,0 24,14 38,14 26,22 30,36 20,28 10,36 14,22 2,14 16,14" />
  </g>
  <!-- Flor sakura -->
  <g transform="translate(310, 180) scale(0.35)" fill="#ff758c" opacity="0.8">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(20)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(92)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(164)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(236)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(308)" />
  </g>
</svg>

