<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="20" fill="#201a24" />
  <circle cx="200" cy="150" r="110" fill="#ff758c" opacity="0.12" filter="url(#glow)" />
  <!-- Flor de cerezo de fondo -->
  <g transform="translate(320, 50) scale(0.6)" opacity="0.25" fill="#ffb7c5">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(0)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(72)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(144)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(216)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(288)" />
    <circle cx="0" cy="0" r="8" fill="#ffd1dc" />
  </g>
  <!-- Caja de inventario estilizada -->
  <g transform="translate(140, 90)">
    <polygon points="60,10 120,40 60,70 0,40" fill="#e28743" />
    <polygon points="0,40 60,70 60,140 0,110" fill="#c96f2a" />
    <polygon points="120,40 60,70 60,140 120,110" fill="#9e5218" />
    <!-- Cinta Sakura -->
    <polygon points="60,10 60,70 50,65 50,15" fill="url(#sakuraGrad)" opacity="0.9" />
    <polygon points="50,65 50,135 60,140 60,70" fill="url(#sakuraGrad)" opacity="0.9" />
  </g>
  <!-- Alerta de Stock Bajo / Warning icon -->
  <g transform="translate(250, 70)" filter="url(#glow)">
    <circle cx="20" cy="20" r="26" fill="url(#amberGrad)" />
    <path d="M20,10 L20,24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="20" cy="30" r="2.5" fill="#ffffff" />
  </g>
  <!-- Flores flotantes Sakura -->
  <g transform="translate(80, 210) scale(0.4)" fill="#ff758c" opacity="0.8">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(15)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(87)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(159)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(231)" />
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(303)" />
  </g>
  <g transform="translate(100, 70) scale(0.3)" fill="#ffb7c5" opacity="0.7">
    <circle cx="0" cy="0" r="16" />
  </g>
</svg>

