<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="20" fill="#1b1c2b" />
  <circle cx="200" cy="150" r="105" fill="#f472b6" opacity="0.12" filter="url(#statGlow)" />
  <!-- Cuaderno / Libreta Sakura abierta -->
  <g transform="translate(110, 80)">
    <!-- Cubierta trasera -->
    <rect x="-6" y="-4" width="192" height="138" rx="10" fill="#9d174d" />
    <!-- Páginas -->
    <rect x="0" y="0" width="90" height="130" rx="4" fill="url(#pageGrad)" />
    <rect x="90" y="0" width="90" height="130" rx="4" fill="url(#pageGrad)" />
    <!-- Línea central de encuadernado -->
    <line x1="90" y1="0" x2="90" y2="130" stroke="#db2777" stroke-width="3" />
    <!-- Líneas de cuaderno -->
    <line x1="15" y1="30" x2="75" y2="30" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="50" x2="75" y2="50" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="70" x2="75" y2="70" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="90" x2="60" y2="90" stroke="#fbcfe8" stroke-width="2" stroke-linecap="round" />
    <!-- Sello de Sakura en página derecha -->
    <g transform="translate(135, 65) scale(0.6)" fill="#f472b6" opacity="0.85">
      <path d="M0,0 C12,-30 30,-30 30,0 C30,30 12,30 0,0 Z" transform="rotate(0)" />
      <path d="M0,0 C12,-30 30,-30 30,0 C30,30 12,30 0,0 Z" transform="rotate(72)" />
      <path d="M0,0 C12,-30 30,-30 30,0 C30,30 12,30 0,0 Z" transform="rotate(144)" />
      <path d="M0,0 C12,-30 30,-30 30,0 C30,30 12,30 0,0 Z" transform="rotate(216)" />
      <path d="M0,0 C12,-30 30,-30 30,0 C30,30 12,30 0,0 Z" transform="rotate(288)" />
      <circle cx="0" cy="0" r="5" fill="#fdf2f8" />
    </g>
    <!-- Bolígrafo Sakura estilizado cruzado -->
    <g transform="translate(170, 20) rotate(25)" filter="url(#statGlow)">
      <rect x="0" y="0" width="10" height="120" rx="5" fill="url(#bookGrad)" />
      <polygon points="0,120 10,120 5,140" fill="#ffd166" />
      <circle cx="5" cy="140" r="1.5" fill="#1e1a2e" />
      <rect x="1" y="10" width="8" height="15" fill="#ffd166" />
    </g>
  </g>
</svg>

