<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff7eb3" />
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="20" fill="#201724" />
  <circle cx="200" cy="150" r="115" fill="#ff758c" opacity="0.15" filter="url(#sakuraGlow)" />
  <!-- Arco Torii japonés estilizado -->
  <g transform="translate(130, 60)">
    <!-- Viga superior -->
    <path d="M-15,10 C45,0 95,0 155,10 L150,22 C95,14 45,14 -10,22 Z" fill="url(#sakuraBg)" filter="url(#sakuraGlow)" />
    <!-- Segunda viga -->
    <rect x="5" y="32" width="130" height="10" rx="3" fill="#ff758c" />
    <!-- Columnas -->
    <rect x="25" y="20" width="14" height="150" rx="4" fill="url(#sakuraBg)" />
    <rect x="101" y="20" width="14" height="150" rx="4" fill="url(#sakuraBg)" />
    <!-- Bases -->
    <rect x="20" y="165" width="24" height="10" rx="3" fill="#ffffff" opacity="0.8" />
    <rect x="96" y="165" width="24" height="10" rx="3" fill="#ffffff" opacity="0.8" />
    <!-- Símbolo o farol central -->
    <g transform="translate(70, 75) scale(0.7)" fill="#ffb7c5">
      <circle cx="0" cy="0" r="16" fill="#ff758c" />
      <circle cx="0" cy="0" r="10" fill="#ffffff" />
    </g>
  </g>
  <!-- Lluvia de pétalos de Sakura -->
  <g transform="translate(60, 50) scale(0.4)" fill="#ffb7c5" opacity="0.9">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(35)" />
  </g>
  <g transform="translate(330, 80) scale(0.45)" fill="#ff758c" opacity="0.85">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(110)" />
  </g>
  <g transform="translate(70, 220) scale(0.35)" fill="#ffb7c5" opacity="0.8">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(75)" />
  </g>
  <g transform="translate(320, 210) scale(0.4)" fill="#ff758c" opacity="0.75">
    <path d="M0,0 C15,-30 45,-30 45,0 C45,30 15,30 0,0 Z" transform="rotate(200)" />
  </g>
</svg>

